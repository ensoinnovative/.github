name: Bug report
description: Something is broken or not working as expected
type: Bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Staging
        - Production
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 130 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Paste any erros. This is formatted as code automatically.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop immages here if helpful.
